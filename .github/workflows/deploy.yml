# Publishes the web app to GitHub Pages on every push to main (and on demand from the Actions tab).
#
# ONE-TIME SWITCH: the first run fails until a repository admin opens Settings > Pages and sets
# "Build and deployment > Source" to "GitHub Actions". After that, re-run the failed workflow.
#
# The pipeline's outputs in web/public/data are committed, and Vite copies them into web/dist with the rest
# of the app. Before anything is published this workflow runs the full check suite itself (lint, tests,
# contract types, data validation, size budget), so a push that breaks the app or the data cannot replace a
# working site: the deploy fails and the previous version stays up.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default for every job: read the repository, nothing else. The deploy job widens this for itself.
permissions:
  contents: read

# One deployment at a time. A running deployment is allowed to finish (as GitHub's Pages examples do), so
# the live site is never left half-published; the newest queued run deploys after it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages reads the repository's Pages settings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt

      - run: npm run setup

      # The gate: the same checks as CI. Includes `python -m pipeline validate` on the committed data and
      # the size budget (GitHub's per-file and per-site limits).
      - run: npm run check

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
